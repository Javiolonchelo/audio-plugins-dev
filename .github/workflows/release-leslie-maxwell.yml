name: Release Leslie Maxwell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LeslieMaxwell/**'
      - '.github/workflows/release-leslie-maxwell.yml'

env:
  BUILD_TYPE: Release
  PLUGIN_DIR: LeslieMaxwell
  PROJECT_NAME: LeslieMaxwell

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract current version
        id: version
        run: |
          VERSION=$(sed -n 's/.*project(LeslieMaxwell VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ${{ env.PLUGIN_DIR }}/CMakeLists.txt)
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION -> New version: $NEW_VERSION"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "${{ env.PROJECT_NAME }}_v${{ steps.version.outputs.current }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in CMakeLists.txt
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          sed -i '' "s/project(LeslieMaxwell VERSION ${{ steps.version.outputs.current }}/project(LeslieMaxwell VERSION ${{ steps.version.outputs.new }}/" ${{ env.PLUGIN_DIR }}/CMakeLists.txt
          echo "VERSION=${{ steps.version.outputs.new }}" >> $GITHUB_ENV

      - name: Use current version
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          echo "VERSION=${{ steps.version.outputs.current }}" >> $GITHUB_ENV

      - name: Commit version bump
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PLUGIN_DIR }}/CMakeLists.txt
          git commit -m "Bump LeslieMaxwell version to ${{ env.VERSION }}"
          git push

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import Developer ID Application certificate (identity = cert + private key)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"

          # Import Developer ID Installer certificate
          echo "$APPLE_INSTALLER_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/installer_certificate.p12
          security import $RUNNER_TEMP/installer_certificate.p12 -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          
          # Set keychain to be used (prepend to existing list, don't replace)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Verify certificates
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarization-profile" \
            --apple-id "$APPLE_ID_EMAIL" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Configure CMake
        run: |
          cmake -B ${{ env.PLUGIN_DIR }}/cmake-build-release \
            -S ${{ env.PLUGIN_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build plugin
        run: |
          cmake --build ${{ env.PLUGIN_DIR }}/cmake-build-release \
            --config ${{ env.BUILD_TYPE }} \
            --target LeslieMaxwell_VST3 LeslieMaxwell_AU LeslieMaxwell_Standalone \
            --parallel

      - name: Sign, notarize and create installer
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          NOTARIZATION_KEYCHAIN_PROFILE: "notarization-profile"
        run: |
          # Extract codesign identity SHA-1 hash from keychain to avoid UTF-8 encoding issues with name
          APPLE_CODESIGN_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$APPLE_CODESIGN_IDENTITY" ]; then
            echo "ERROR: No Developer ID Application identity found in keychain"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Using codesign identity: $APPLE_CODESIGN_IDENTITY"
          export APPLE_CODESIGN_IDENTITY

          ./scripts/sign_and_notarize.sh \
            Release \
            "com.dBobStudio.LeslieMaxwell" \
            "Leslie Maxwell" \
            "${{ env.VERSION }}" \
            "LeslieMaxwell" \
            "${{ env.PLUGIN_DIR }}" \
            "LICENSE"

      - name: Read release metadata
        id: meta
        run: |
          DESCRIPTION=$(sed -n 's/^description: *"\(.*\)"/\1/p' ${{ env.PLUGIN_DIR }}/release-info.yml)
          IMAGE_URL=$(sed -n 's/^image: *"\(.*\)"/\1/p' ${{ env.PLUGIN_DIR }}/release-info.yml)
          IMAGE_WIDTH=$(sed -n 's/^image_width: *\(.*\)/\1/p' ${{ env.PLUGIN_DIR }}/release-info.yml)
          IMAGE_HEIGHT=$(sed -n 's/^image_height: *\(.*\)/\1/p' ${{ env.PLUGIN_DIR }}/release-info.yml)
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "image_width=$IMAGE_WIDTH" >> $GITHUB_OUTPUT
          echo "image_height=$IMAGE_HEIGHT" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ env.PROJECT_NAME }}_v${{ env.VERSION }}"
          git tag -a "$TAG_NAME" -m "Release Leslie Maxwell v${{ env.VERSION }}"
          git push origin "$TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="${{ steps.meta.outputs.description }}
          <img width=\"${{ steps.meta.outputs.image_width }}\" height=\"${{ steps.meta.outputs.image_height }}\" alt=\"Leslie Maxwell\" src=\"${{ steps.meta.outputs.image_url }}\" />"

          gh release create "${{ env.TAG_NAME }}" \
            --title "Leslie Maxwell v${{ env.VERSION }}" \
            --notes "$BODY" \
            ${{ env.PLUGIN_DIR }}/cmake-build-release/installer_output/MAC_*.pkg

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
